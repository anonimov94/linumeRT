name: ci

on:
  push:
    branches: [main, "wip/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install lint test
      - run: make test-c

  # Scenariusze Plant z atrapą mastera na wszystkich config/machines/*.yaml (REQ-QA-02, sesja 024).
  plant-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install plant-matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raporty-scenariuszy
          path: build/raporty/

  # Porządki zlecone przez właściciela: tylko gałęzie w całości zawarte w main.
  cleanup-merged-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, plant-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete fully merged branches with a lease
        shell: bash
        run: |
          set -euo pipefail
          git for-each-ref --merged=HEAD --format='%(objectname) %(refname:strip=3)' \
            refs/remotes/origin > "$RUNNER_TEMP/linumert-merged-branches"
          while read -r sha branch; do
            case "$branch" in main|HEAD|'') continue ;; esac
            git push --force-with-lease="refs/heads/$branch:$sha" origin ":refs/heads/$branch"
          done < "$RUNNER_TEMP/linumert-merged-branches"
