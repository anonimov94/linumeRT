name: LinuxCNC RIP smoke
on:
  pull_request:
    paths:
      - '.github/workflows/linuxcnc.yml'
      - 'tools/ci/**'
      - 'tools/agent_tests/**'
      - 'tests/**'
      - 'core/**'
      - 'hal/**'
      - 'config/**'
      - 'simulation/**'
      - 'plant/**'
      - 'pyproject.toml'
      - 'screens/**'
      - 'Makefile'
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
concurrency:
  group: linuxcnc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linuxcnc:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm
      # --init: bez procesu init zombie po testach LinuxCNC nigdy nie znikają (dług 024)
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 35
    steps:
      # Git przed checkoutem: bez niego actions/checkout pobiera archiwum bez .git i krok
      # `git diff --check` w runnerze kończy się błędem (run 39121565345).
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install build and GUI dependencies
        run: |
          bash tools/ci/build-linuxcnc.sh --install-deps
          apt-get install -y --no-install-recommends python3-pyqtgraph
          useradd -m -s /bin/bash codex
          chown -R codex:codex "$GITHUB_WORKSPACE"
      - name: Resolve upstream revision
        id: upstream
        run: echo "sha=$(git ls-remote https://github.com/LinuxCNC/linuxcnc.git refs/heads/2.9 | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: /home/codex/.cache/linuxcnc-2.9
          key: linuxcnc-${{ runner.os }}-${{ runner.arch }}-bookworm-${{ steps.upstream.outputs.sha }}-${{ hashFiles('tools/ci/build-linuxcnc.sh') }}
      - name: Build RIP uspace
        run: |
          if [ -d /home/codex/.cache ]; then chown -R codex:codex /home/codex/.cache; fi
          runuser -u codex -- env HOME=/home/codex bash tools/ci/build-linuxcnc.sh
      - name: Create test environment
        run: |
          runuser -u codex -- python3 -m venv --system-site-packages .venv
          runuser -u codex -- .venv/bin/python -m pip install -e '.[dev]'
      - name: SKIN-01 renderer on Debian Mesa
        run: >-
          runuser -u codex -- env HOME=/home/codex LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x800x24'
          .venv/bin/python tools/dev/renderer-check.py --output build/skin01
      - name: Start Plant with the actual QtVCP display
        run: >-
          runuser -u codex -- env HOME=/home/codex PYTHON=.venv/bin/python
          xvfb-run -a -s '-screen 0 1440x1100x24'
          bash tools/ci/test-linuxcnc.sh tests/test_plant_screen_linuxcnc.py -x
      - name: Audit typed numeric values in the actual QtVCP screen
        run: >-
          runuser -u codex -- env HOME=/home/codex PYTHON=.venv/bin/python
          xvfb-run -a -s '-screen 0 1440x1100x24'
          bash tools/ci/test-linuxcnc.sh
          tests/test_hmi_shell_gui.py::test_shell_selftest_in_gui -x
      - name: Shared runner with real LinuxCNC
        env:
          LINUXCNC_SCREENSHOT: ${{ github.workspace }}/state/spike_qtdragon.png
        run: runuser -u codex -- env HOME=/home/codex .venv/bin/python tools/agent_tests/run.py --model Codex --linuxcnc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linuxcnc-evidence
          path: |
            build/skin01/
            state/test-runs/
            state/spike_qtdragon.png
            /tmp/pytest-of-codex/
