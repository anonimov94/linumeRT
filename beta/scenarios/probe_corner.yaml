# linumeRT · scenariusz Plant (sesja 033). Model-Author: Claude.
# Sondowanie narożnika przygotówki (ściana X min i ściana Y min celu sondy z machine.yaml).
# Dla każdej ściany: wzorzec w jednym miejscu (xr, yr), pomiar w innym (x1/x2, y1), kalibracja
# stałą poprawką z wzorca. Oczekiwane wartości z geometrii: X = target.min.x = 250,
# Y = target.min.y = 350 mm (pozycje sondowane w układzie maszyny, G54 wyzerowany).
# Przejazdy poziome po Z-40 (końcówka 60 mm niżej: w obrębie przygotówki -110…-90); między
# ścianami wrzeciono unosi się do Z-5, żeby nie zahaczyć o przygotówkę. Tylko LinuxCNC.
name: probe_corner
description: "Sondowanie narożnika X/Y przygotówki: błąd bezwzględny, powtarzalność i po kalibracji ≤ 0,01 mm."
requirements: [REQ-VM-09]
machine: ../../config/machines/mill_servo_table.yaml
master: linuxcnc
duration: 560
steps:
  - {at: 0.1, action: enable}
  - {at: 0.3, action: mdi, command: "G21 G90 G49 G10 L2 P1 X0 Y0 Z0 R0", settle: true}
  - {at: 0.4, action: mdi, command: "G54", settle: true}
  - {at: 0.5, action: mdi, command: "G53 G0 Z-5", settle: true}
  # ---- ściana X min, wzorzec w Y380
  - {at: 1.0, action: mdi, command: "G53 G0 X200 Y380", settle: true}
  - {at: 1.1, action: mdi, command: "G53 G0 Z-40", settle: true}
  - {at: 1.2, action: mdi, command: "G91 G38.2 X100 F100", settle: true, timeout: 120}
  - {at: 1.3, action: mdi, command: "G91 G1 X-2 F300", settle: true}
  - {at: 1.4, action: mdi, command: "G91 G38.2 X4 F10", settle: true}
  - {at: 1.5, action: capture, name: xr}
  - {at: 1.6, action: mdi, command: "G91 G1 X-2 F300", settle: true}
  # ---- ściana X min, pomiar w Y420 (dwa dokładne)
  - {at: 2.0, action: mdi, command: "G90", settle: true}
  - {at: 2.1, action: mdi, command: "G53 G0 X200 Y420", settle: true}
  - {at: 2.2, action: mdi, command: "G91 G38.2 X100 F100", settle: true, timeout: 120}
  - {at: 2.3, action: mdi, command: "G91 G1 X-2 F300", settle: true}
  - {at: 2.4, action: mdi, command: "G91 G38.2 X4 F10", settle: true}
  - {at: 2.5, action: capture, name: x1}
  - {at: 2.6, action: mdi, command: "G91 G1 X-2 F300", settle: true}
  - {at: 2.7, action: mdi, command: "G91 G38.2 X4 F10", settle: true}
  - {at: 2.8, action: capture, name: x2}
  - {at: 2.9, action: mdi, command: "G91 G1 X-2 F300", settle: true}
  # ---- ściana Y min, wzorzec w X280
  - {at: 3.0, action: mdi, command: "G90", settle: true}
  - {at: 3.1, action: mdi, command: "G53 G0 Z-5", settle: true}
  - {at: 3.2, action: mdi, command: "G53 G0 X280 Y300", settle: true}
  - {at: 3.3, action: mdi, command: "G53 G0 Z-40", settle: true}
  - {at: 3.4, action: mdi, command: "G91 G38.2 Y100 F100", settle: true, timeout: 120}
  - {at: 3.5, action: mdi, command: "G91 G1 Y-2 F300", settle: true}
  - {at: 3.6, action: mdi, command: "G91 G38.2 Y4 F10", settle: true}
  - {at: 3.7, action: capture, name: yr}
  - {at: 3.8, action: mdi, command: "G91 G1 Y-2 F300", settle: true}
  # ---- ściana Y min, pomiar w X320 (dwa dokładne)
  - {at: 4.0, action: mdi, command: "G90", settle: true}
  - {at: 4.1, action: mdi, command: "G53 G0 X320 Y300", settle: true}
  - {at: 4.2, action: mdi, command: "G91 G38.2 Y100 F100", settle: true, timeout: 120}
  - {at: 4.3, action: mdi, command: "G91 G1 Y-2 F300", settle: true}
  - {at: 4.4, action: mdi, command: "G91 G38.2 Y4 F10", settle: true}
  - {at: 4.5, action: capture, name: y1}
  - {at: 4.6, action: mdi, command: "G91 G1 Y-2 F300", settle: true}
  - {at: 4.7, action: mdi, command: "G91 G38.2 Y4 F10", settle: true}
  - {at: 4.8, action: capture, name: y2}
  - {at: 4.9, action: mdi, command: "G91 G1 Y-2 F300", settle: true}
  - {at: 5.0, action: mdi, command: "G90", settle: true}
  - {at: 5.1, action: mdi, command: "G53 G0 Z-5", settle: true}
expect:
  - no_alarm: {}
  - probe_tripped: {capture: xr, value: true}
  - probe_tripped: {capture: x1, value: true}
  - probe_tripped: {capture: yr, value: true}
  - probe_tripped: {capture: y1, value: true}
  - probed: {capture: x1, axis: X, value: 250.0, tol: 0.02}     # błąd bezwzględny (luz napędu 0,01)
  - probed: {capture: y1, axis: Y, value: 350.0, tol: 0.02}
  - probe_repeat: {captures: [x1, x2], axis: X, tol: 0.002}
  - probe_repeat: {captures: [y1, y2], axis: Y, tol: 0.002}
  - probed: {capture: x1, axis: X, value: 250.0, tol: 0.01, calibrate: {capture: xr, value: 250.0}}
  - probed: {capture: y1, axis: Y, value: 350.0, tol: 0.01, calibrate: {capture: yr, value: 350.0}}
