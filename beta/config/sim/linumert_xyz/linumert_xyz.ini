# SPDX-License-Identifier: GPL-2.0-or-later
# linumeRT · symulator 3 osi (trivkins) bez GUI (usługa linumert_headless) i kontraktem sygnałów D05.
# Na podstawie configs/sim/qtdragon/qtdragon_xyz/qtdragon_metric.ini z LinuxCNC 2.9 (GPL-2);
# zmiany: zakresy osi, własne pliki HAL (docs/HAL_KONTRAKT.md), bazowanie na krańcówkach,
# usunięte okna testowe i zakładka vismach. Pochodzenie: docs/PROVENANCE.md.
# Model-Author: Claude · sesja 004.

[EMC]
VERSION = 1.1
MACHINE = linumeRT sim XYZ
DEBUG = 0x00000000

[DISPLAY]
DISPLAY = linumert_headless
TITLE = linumeRT sim XYZ
PREFERENCE_FILE_PATH = WORKINGFOLDER/linumert.pref
MAX_FEED_OVERRIDE = 1.2
MIN_SPINDLE_0_OVERRIDE = 0.5
MAX_SPINDLE_0_OVERRIDE = 1.2
DEFAULT_SPINDLE_0_SPEED = 12000
SPINDLE_INCREMENT = 200
MIN_SPINDLE_0_SPEED = 1000
MAX_SPINDLE_0_SPEED = 24000
MAX_SPINDLE_POWER = 2200
MIN_LINEAR_VELOCITY = 0
MAX_LINEAR_VELOCITY = 100.0
DEFAULT_LINEAR_VELOCITY = 50.0
INCREMENTS = 10 mm, 1.0 mm, 0.10 mm, 0.01 mm
CYCLE_TIME = 100
PROGRAM_PREFIX = ../nc_files
MDI_HISTORY_FILE = mdi_history.dat
LOG_FILE = linumert.log

[MDI_COMMAND_LIST]
MDI_COMMAND = G0 Z25;X0 Y0;Z0, Goto\nUser\nZero
MDI_COMMAND = G53 G0 Z0;G53 G0 X0 Y0,Goto\nMachn\nZero

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap G-Code File (*.ngc,*.nc,*.tap)

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[LINUMERT]
MACHINE_PROFILE = sim
# Wyłącznie konfiguracja bez fizycznych wyjść napędów.
VIRTUAL_MODE = 1
# Grzyb E-STOP w HMI (D35, config/hal/linumert_hmi_estop.hal): limit sygnału życia ekranu [s];
# BYPASS = 1 tylko dla uruchomień bez ekranu (testy headless) — w pracy zawsze 0.
HMI_HEARTBEAT_TIMEOUT = 2.0
HMI_ESTOP_BYPASS = 0
# Symulacja materiału i kolizji w HMI (simulation/linumert_sim): model maszyny, baza narzędzi
# (SQLite, powstaje przy pierwszym uruchomieniu z TOOL_SEED; tool.tbl jest z niej eksportowany)
MACHINE_YAML = machine.yaml
TOOL_DB = linumert_tools.db
TOOL_SEED = tools_seed.yaml

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[RS274NGC]
PARAMETER_FILE = linumert.var
RS274NGC_STARTUP_CODE = G17 G21 G40 G43H0 G54 G64P0.01 G80 G90 G94 G97 M5 M9
SUBROUTINE_PATH = macros:/usr/share/linuxcnc/ncfiles/probe/basic_probe/macros
REMAP = M6 modalgroup=6 ngc=lrt_m6

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 100.0
DEFAULT_LINEAR_VELOCITY = 50.0
SPINDLES = 1

[HAL]
HALUI = halui
# Bliźniak bez GUI: nie ładujemy hal-i zależnych od ekranu.
#  - linumert_hmi_estop.hal: grzyb E-STOP w HMI wchodzi SZEREGOWO w łańcuch (D35) i jest
#    fail-safe — bez ekranu jego piny są 0, więc łańcuch nigdy by się nie zamknął.
#  - linumert_pause_retract.hal i POSTGUI_HALFILE: podpinają piny komponentu ekranu
#    `linumert.*`, których bez GUI nie ma.
# Łańcuch E-STOP zostaje sprzętowy/emulowany (lrt_estop2); przyszłe GUI dokłada swój
# element przez ten sam mechanizm, nic tu nie trzeba przerabiać.
HALFILE = linumert_sim.hal

[HALUI]

[PROBE]
USE_PROBE = basicprobe

[AXIS_X]
MIN_LIMIT = 0.0
MAX_LIMIT = 600.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0

[AXIS_Y]
MIN_LIMIT = 0.0
MAX_LIMIT = 400.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0

[AXIS_Z]
MIN_LIMIT = -120.0
MAX_LIMIT = 0.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 600.0
OFFSET_AV_RATIO = 0.2

# Bazowanie X/Y: krańcówka przy minimum osi, szybkie szukanie w stronę krańcówki, potem wolny
# zjazd i baza na zwolnieniu styku (HOME_LATCH_VEL ze znakiem przeciwnym = strategia
# `homing.latch: release` z machine.yaml). Z: krańcówka na górze, ta sama strategia.
# Czujnik zadziała przy 1 mm od końca zakresu (linumert_sim.hal, histereza 0,02 mm).
[JOINT_0]
AXIS = X
TYPE = LINEAR
MIN_LIMIT = -2.0
MAX_LIMIT = 600.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0
FERROR = 1.0
MIN_FERROR = 0.5
HOME_SEARCH_VEL = -20.0
HOME_LATCH_VEL = 1.0
HOME_OFFSET = 1.0
HOME = 5.0
HOME_SEQUENCE = 1
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO

[JOINT_1]
AXIS = Y
TYPE = LINEAR
MIN_LIMIT = -2.0
MAX_LIMIT = 400.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0
FERROR = 1.0
MIN_FERROR = 0.5
HOME_SEARCH_VEL = -20.0
HOME_LATCH_VEL = 1.0
HOME_OFFSET = 1.0
HOME = 5.0
HOME_SEQUENCE = 1
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO

[JOINT_2]
AXIS = Z
TYPE = LINEAR
MIN_LIMIT = -120.0
MAX_LIMIT = 2.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 600.0
FERROR = 1.0
MIN_FERROR = 0.5
HOME_SEARCH_VEL = 10.0
HOME_LATCH_VEL = -1.0
HOME_OFFSET = -1.0
HOME = -5.0
HOME_SEQUENCE = 0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
