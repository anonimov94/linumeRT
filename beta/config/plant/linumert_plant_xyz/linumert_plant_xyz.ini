# SPDX-License-Identifier: GPL-2.0-or-later
# linumeRT · LinuxCNC + wirtualna obrabiarka Plant (LRT-NET) · maszyna mill_servo_table:
# X, Y jako portal 2-napędowy (Y1, Y2), Z; serwonapędy CiA 402; krańcówki NC współdzielone z
# bazowaniem; E-STOP NC i sonda z Plant. Jointy = napędy z machine.yaml bez wrzeciona, w kolejności
# pliku (drv_x, drv_y1, drv_y2, drv_z) = kolejność osi w ramce LRT-NET.
# Wartości osi z config/machines/mill_servo_table.yaml (pilnuje tests/test_plant_config.py).
# Struktura na wzór config/sim/linumert_xyz (pochodzenie: docs/PROVENANCE.md).
# Model-Author: Claude · sesja 018. NIEZWERYFIKOWANE NA SPRZĘCIE.

[EMC]
VERSION = 1.1
MACHINE = linumeRT Plant mill_servo_table
DEBUG = 0x00000000

[DISPLAY]
DISPLAY = linumert_headless
TITLE = linumeRT Plant XYYZ
PREFERENCE_FILE_PATH = WORKINGFOLDER/linumert.pref
MAX_FEED_OVERRIDE = 1.2
MIN_SPINDLE_0_OVERRIDE = 0.5
MAX_SPINDLE_0_OVERRIDE = 1.2
DEFAULT_SPINDLE_0_SPEED = 6000
SPINDLE_INCREMENT = 200
MIN_SPINDLE_0_SPEED = 100
MAX_SPINDLE_0_SPEED = 8000
MAX_SPINDLE_POWER = 2200
MIN_LINEAR_VELOCITY = 0
MAX_LINEAR_VELOCITY = 200.0
DEFAULT_LINEAR_VELOCITY = 50.0
INCREMENTS = 10 mm, 1.0 mm, 0.10 mm, 0.01 mm
CYCLE_TIME = 100
PROGRAM_PREFIX = ../../sim/nc_files
MDI_HISTORY_FILE = mdi_history.dat
LOG_FILE = linumert.log

[MDI_COMMAND_LIST]
MDI_COMMAND = G53 G0 Z-5;G53 G0 X300 Y450, Goto\nCenter
MDI_COMMAND = G53 G0 Z-5;G53 G0 X5 Y5,Goto\nHome

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap G-Code File (*.ngc,*.nc,*.tap)

[PLANT]
# adres serwera Plant (VM-B w sieci lrtnet: 10.77.0.20, docs/VM.md); port jak network.port w plant.yaml
IP = 127.0.0.1
PORT = 47700
AXES = 4

[KINS]
KINEMATICS = trivkins coordinates=XYYZ kinstype=BOTH
JOINTS = 4

[LINUMERT]
MACHINE_PROFILE = plant
# Grzyb E-STOP w HMI (D35, config/hal/linumert_hmi_estop.hal): limit sygnału życia ekranu [s];
# BYPASS = 1 tylko dla uruchomień bez ekranu (testy headless) — w pracy zawsze 0.
HMI_HEARTBEAT_TIMEOUT = 2.0
HMI_ESTOP_BYPASS = 0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = ../../sim/linumert_xyz/tool.tbl

[RS274NGC]
PARAMETER_FILE = linumert.var
RS274NGC_STARTUP_CODE = G17 G21 G40 G43H0 G54 G64P0.01 G80 G90 G94 G97 M5 M9
SUBROUTINE_PATH = macros
REMAP = M6 modalgroup=6 ngc=lrt_m6

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[TRAJ]
COORDINATES = XYYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 200.0
DEFAULT_LINEAR_VELOCITY = 50.0
SPINDLES = 1

[HAL]
HALUI = halui
# Bliźniak bez GUI: bez hal-i zależnych od ekranu (grzyb E-STOP w HMI jest fail-safe —
# bez ekranu jego piny są 0 i łańcuch nigdy by się nie zamknął; D35).
HALFILE = linumert_plant.hal
HALFILE = spindle_sim.hal

[HALUI]

# Osie: zakres = soft_limits z machine.yaml
[AXIS_X]
MIN_LIMIT = 1.0
MAX_LIMIT = 599.0
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 2000.0

[AXIS_Y]
MIN_LIMIT = 1.0
MAX_LIMIT = 899.0
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 2000.0

[AXIS_Z]
MIN_LIMIT = -119.0
MAX_LIMIT = -1.0
MAX_VELOCITY = 80.0
MAX_ACCELERATION = 2500.0
OFFSET_AV_RATIO = 0.2

# Jointy. SCALE = impulsy/mm napędu (MachineModel.counts_per_unit z machine.yaml i szablonu napędu).
# Bazowanie jak homing w machine.yaml (latch: approach = HOME_LATCH_VEL z tym samym znakiem).
# Czujnik bazy = krańcówka, więc HOME_IGNORE_LIMITS = YES. Indeks (switch_index osi X) wymaga
# ramki LRT-NET v2 (DECYZJE, sesja 017) - tu bazowanie X tylko na krańcówce.
[JOINT_0]
AXIS = X
TYPE = LINEAR
SCALE = 13107.195313
MIN_LIMIT = 0.0
MAX_LIMIT = 600.0
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 2000.0
FERROR = 2.0
MIN_FERROR = 0.5
HOME_SEARCH_VEL = -40.0
HOME_LATCH_VEL = -4.0
HOME_OFFSET = 0.5
HOME = 5.0
HOME_SEQUENCE = 1
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES

# Portal Y: dwa jointy bazowane razem (HOME_SEQUENCE ujemne = synchronicznie), wspólny czujnik.
[JOINT_1]
AXIS = Y
TYPE = LINEAR
SCALE = 13107.195313
MIN_LIMIT = 0.0
MAX_LIMIT = 900.0
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 2000.0
FERROR = 2.0
MIN_FERROR = 0.5
HOME_SEARCH_VEL = -40.0
HOME_LATCH_VEL = -4.0
HOME_OFFSET = 0.5
HOME = 5.0
HOME_SEQUENCE = -1
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES

[JOINT_2]
AXIS = Y
TYPE = LINEAR
SCALE = 13107.195313
MIN_LIMIT = 0.0
MAX_LIMIT = 900.0
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 2000.0
FERROR = 2.0
MIN_FERROR = 0.5
HOME_SEARCH_VEL = -40.0
HOME_LATCH_VEL = -4.0
HOME_OFFSET = 0.5
HOME = 5.0
HOME_SEQUENCE = -1
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES

[JOINT_3]
AXIS = Z
TYPE = LINEAR
SCALE = 13107.195313
MIN_LIMIT = -120.0
MAX_LIMIT = 0.0
MAX_VELOCITY = 80.0
MAX_ACCELERATION = 2500.0
FERROR = 2.0
MIN_FERROR = 0.5
HOME_SEARCH_VEL = 20.0
HOME_LATCH_VEL = 2.0
HOME_OFFSET = -0.5
HOME = -5.0
HOME_SEQUENCE = 0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
