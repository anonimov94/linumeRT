# Próbki składni G-code LinuxCNC (sesja 044). ok: oczekiwany werdykt leksera (true = brak błędów),
# code: oczekiwany kod pierwszego błędu. oracle: porównanie z interpreterem rs274 LinuxCNC 2.9
# (tests/test_lexer.py, marker linuxcnc): same (domyślnie) = ten sam werdykt; strict = lekser
# celowo surowszy (rs274 przyjmuje albo zawiesza się); semantic = składnia poprawna, błąd
# wykrywa dopiero interpreter (to nie zadanie leksera).
- {id: proste_ruchy, ok: true, text: "G21 G90\nG0 X10 Y-5.5 Z.5\nG1 X1 F100\nM2"}
