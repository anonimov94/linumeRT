### linumeRT · VM-B (Plant): preseed Debiana 12 netinst (sesja 025). Model-Author: Claude.
### Szablon dla `VBoxManage unattended install --script-template` (create-vms.ps1). Pola @@VBOX_INSERT_…@@
### wypełnia VirtualBox: login, hasło (z pliku podanego przy tworzeniu VM, nie z repozytorium), nazwa hosta,
### strefa czasowa. NIEZWERYFIKOWANE W VIRTUALBOX: sprawdzić przy pierwszej instalacji (docs/VM.md §2).

# Język i klawiatura
d-i debian-installer/locale string @@VBOX_INSERT_LOCALE@@
d-i keyboard-configuration/xkb-keymap select pl
d-i console-setup/ask_detect boolean false

# Sieć: karta 1 (NAT) przez DHCP; lrtnet i host-only konfiguruje post-install-plant.sh
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string @@VBOX_INSERT_HOSTNAME_WITHOUT_DOMAIN@@
d-i netcfg/get_domain string @@VBOX_INSERT_HOSTNAME_DOMAIN@@
d-i netcfg/hostname string @@VBOX_INSERT_HOSTNAME_WITHOUT_DOMAIN@@

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Konta: root wyłączony, użytkownik z sudo
d-i passwd/root-login boolean false
d-i passwd/user-fullname string linumeRT
d-i passwd/username string @@VBOX_INSERT_USER_LOGIN@@
d-i passwd/user-password password @@VBOX_INSERT_USER_PASSWORD@@
d-i passwd/user-password-again password @@VBOX_INSERT_USER_PASSWORD@@
d-i user-setup/allow-password-weak boolean true

# Zegar
d-i clock-setup/utc boolean true
d-i time/zone string @@VBOX_INSERT_TIME_ZONE_UX@@
d-i clock-setup/ntp boolean true

# Dysk: cały dysk wirtualny, jedna partycja
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Pakiety: bez środowiska graficznego (panel Plant otwiera się w przeglądarce hosta)
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo git ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Program rozruchowy
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Po instalacji: użytkownik w grupie sudo, wyłączenie z napędu instalacyjnego
d-i preseed/late_command string in-target adduser @@VBOX_INSERT_USER_LOGIN@@ sudo
d-i finish-install/reboot_in_progress note
