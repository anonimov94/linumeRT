# linumeRT · parametry maszyn wirtualnych VM-A i VM-B (sesja 025). Model-Author: Claude.
# Jedno źródło wartości dla create-vms.ps1, post-install-*.sh i docs/VM.md (test spójności:
# tests/test_vm_scripts.py). Format: KLUCZ=wartość, bez spacji i cudzysłowów (czyta je bash i PowerShell).

# VM-A: LinuxCNC 2.9 + ekran linumeRT
CTL_NAME=linumert-ctl
CTL_CPUS=4
CTL_RAM_MB=4096
CTL_DISK_MB=30000
CTL_VRAM_MB=128
CTL_HOSTNAME=linumert-ctl

# VM-B: Plant (wirtualna obrabiarka)
PLANT_NAME=linumert-plant
PLANT_CPUS=2
PLANT_RAM_MB=2048
PLANT_DISK_MB=12000
PLANT_VRAM_MB=16
PLANT_HOSTNAME=linumert-plant

# Sieć wewnętrzna VirtualBox (tylko VM-A ↔ VM-B, LRT-NET), docs/PLANT.md §1
LRTNET_NAME=lrtnet
LRTNET_PREFIX=24
LRTNET_CTL_IP=10.77.0.10
LRTNET_PLANT_IP=10.77.0.20

# Usługi (porty)
LRTNET_PORT=47700
PANEL_PORT=8080
VFD_BRIDGE_PORT=47710
VFD_DEVICE=/tmp/linumert-hy_vfd

# Użytkownik w obu VM i katalog repozytorium
VM_USER=linumert
REPO_URL=https://github.com/anonimov94/linumeRT.git
REPO_DIR=/opt/linumert
