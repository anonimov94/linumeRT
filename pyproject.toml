[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linumert-lite"
version = "0.1.0"
description = "Headless LinuxCNC backend: CAM 2D, machine models, Plant and simulation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-2.0-or-later"}
dependencies = ["numpy>=1.24", "pydantic>=2,<3", "pyyaml>=6"]

[project.scripts]
linumert-lite = "linumert.cli:main"
linumert-plant = "linumert_plant.__main__:main"
linumert-headless = "linumert.cnc.headless:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1"]

[tool.setuptools]
include-package-data = false
package-dir = {linumert = "core/linumert", linumert_sim = "simulation/linumert_sim", linumert_plant = "plant/server/linumert_plant"}
packages = ["linumert", "linumert.alarms", "linumert.tools", "linumert.programs", "linumert.generators", "linumert.machine", "linumert.machine.drives", "linumert.cnc", "linumert.diag", "linumert_sim", "linumert_plant"]

[tool.setuptools.package-data]
"linumert.alarms" = ["catalog.yaml"]
"linumert.programs" = ["lnx_schema.json"]
"linumert.machine" = ["resources/*.hal", "resources/*.ngc", "resources/*.tbl"]
"linumert.machine.drives" = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core", "simulation", "plant/server"]
markers = ["linuxcnc: requires a separate LinuxCNC installation", "plant: requires the Plant C runtime"]
addopts = "-m 'not linuxcnc'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv-linux"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
