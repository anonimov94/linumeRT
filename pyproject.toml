[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linumert"
version = "0.0.1"
description = "linumeRT - otwarty ekran operatora i narzedzia dla LinuxCNC (maszyny CNC DIY)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy",
    "pydantic",
    "pyyaml",
]

[project.scripts]
# Generator konfiguracji LinuxCNC z machine.yaml (sesja 062)
linumert-config = "linumert.machine.config_build:main"
# Brama web-hmi LinuxCNC <-> przegladarka (webhmi/, DECYZJE 2026-10-26)
linumert-webhmi = "linumert_webhmi.__main__:main"
linumert-relief = "linumert.generators.relief:main"

[project.optional-dependencies]
# Panel web Plant (sesja 022); bez tej grupy Plant działa, a panel zgłasza brak zależności.
panel = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "websockets>=11",
]
dev = [
    "pytest",
    "ruff",
    "httpx",
    "linumert[panel]",
]

# Trzy pakiety w jednym repozytorium (patrz docs/DECYZJE.md, wpis sesji 001):
#   linumert        - rdzen, niezalezny od UI            (core/linumert)
#   linumert_sim    - symulacja, osobny proces           (simulation/linumert_sim)
#   linumert_plant  - serwer Plant (LRT-NET, panel web)  (plant/server/linumert_plant)
#   linumert_webhmi - brama web-hmi LinuxCNC <-> przegladarka (webhmi/server/linumert_webhmi)
[tool.setuptools]
packages = [
    "linumert",
    "linumert.alarms",
    "linumert.tools",
    "linumert.programs",
    "linumert.generators",
    "linumert.machine",
    "linumert.plugins",
    "linumert.cnc",
    "linumert.diag",
    "linumert_sim",
    "linumert_plant",
    "linumert_plant.panel",
    "linumert_webhmi",
]

[tool.setuptools.package-data]
"linumert.alarms" = ["catalog.yaml"]
"linumert.programs" = ["lnx_schema.json"]
"linumert_webhmi" = ["static/*.html", "static/*.js", "static/*.css",
                     "static/js/*.js", "static/js/*.json"]
"linumert_plant.panel" = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg",
                          "static/vendor/*", "static/ikony/*"]

[tool.setuptools.package-dir]
linumert = "core/linumert"
linumert_sim = "simulation/linumert_sim"
linumert_plant = "plant/server/linumert_plant"
linumert_webhmi = "webhmi/server/linumert_webhmi"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core", "simulation", "plant/server", "webhmi/server"]
markers = [
    "linuxcnc: test wymaga dzialajacego LinuxCNC (sesja 003); domyslnie pomijany",
]
addopts = "-m 'not linuxcnc'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["screens/linumert"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
