# Szablon napędu wirtualnego linumeRT: Serwo krokowe, ok. 2,2 N·m (pętla zamknięta).
# Wartości przykładowe — typowe dla klasy napędu, zaokrąglone; NIE pochodzą z dokumentacji
# żadnego producenta (docs/PROVENANCE.md). NIEZWERYFIKOWANE NA SPRZĘCIE.
# Wszystkie pola są jawne; format i zakresy: plant/library/drives/README.md.
# Model-Author: Claude · sesja 013
id: servo_stepper_22nm
version: 1
based_on: null
name: "Serwo krokowe, ok. 2,2 N·m (pętla zamknięta)"
description: "Krokowiec z enkoderem i pętlą zamkniętą (serwo krokowe); błąd nadążania ponad okno daje awarię."
value_source: "przykładowe wartości typowe dla serwa krokowego klasy 2,2 N·m; zaokrąglone, nie pochodzą z karty katalogowej żadnego producenta"
type: servo_stepper

# Parametry zmieniane w locie (REQ-VD-04); pozostałe wymagają przeładowania modelu.
live:
  - motor.rotor_inertia
  - mechanics.load
  - mechanics.j_screw
  - mechanics.friction_coulomb
  - mechanics.friction_static
  - mechanics.friction_viscous
  - mechanics.backlash
  - limits.torque_limit_permille
  - electrical.supply_voltage

motor:
  rated_torque: 2.2           # [N·m] moment trzymania
  peak_torque: 2.2            # [N·m]
  peak_time_s: 0.0            # [s] czas pracy ze szczytem (I2t); 0 = bez ochrony
  rotor_inertia: 6.5000e-05       # [kg·m²]
  torque_constant: 0.55      # [N·m/A] = moment znamionowy / prąd znamionowy
  rated_current: 4.0         # [A]
  peak_current: 4.0          # [A]
  encoder_counts_per_rev: 4000   # [imp/obr]
  encoder_noise_counts: 0.0
  # Krzywa moment–prędkość: [omega rad/s, moment N·m]; poniżej pierwszego punktu stała, powyżej ostatniego 0.
  torque_curve: [[0.0, 2.2], [60.0, 2.1], [150.0, 1.6], [250.0, 1.0], [350.0, 0.5], [450.0, 0.0]]
  brake_present: false
  brake_release_ms: 0.0
  brake_engage_ms: 0.0

electrical:
  nominal_voltage: 48.0       # [V]
  supply_voltage: 48.0        # [V] bieżące; skaluje krzywą momentu (live)

# Regulatory: kv, ti, kp_pos i inertia_est dobrane jak lrt_drive_tune_servo() dla pasma 150 rad/s
# przy kroku 1 ms i bezwładności zastępczej 1.2033e-04 kg·m² (J wirnika + J śruby + load·ratio²).
controller:
  kp_pos: 30.0
  kv: 0.01805
  ti: 0.026667
  kff_vel: 1.0
  kff_acc: 1.0
  inertia_est: 1.2033e-04
  vel_filter_hz: 400.0
  ff_filter_hz: 300.0
  max_speed: 400.0

limits:
  torque_limit_permille: 1000   # 6072h [‰ znamionowego]
  following_window: 200       # 6065h [imp]
  following_window_ms: 10
  quick_stop_decel: 200000      # 6085h [imp/s²]
  standstill_speed: 0.1
  boot_time_s: 0.5

reactions:
  quick_stop_option: 2     # 605Ah: 1 = wyłącz napęd, 2 = rampa i wyłączenie
  fault_reaction_option: 0  # 605Eh: 0 = wyłącz napęd, 2 = rampa quick stop
  brake_on_fault: false

cia402:
  objects: ["603Fh", "6040h", "6041h", "605Ah", "605Eh", "6060h", "6061h", "6064h", "6065h", "6066h", "606Ch", "6072h", "6077h", "607Ah", "6085h", "6098h", "6099h", "609Ah", "60B1h", "60B2h"]
  homing_method: 35        # 6098h (sekwencje bazowania: sesja 015)
  homing_speed_switch: 4000
  homing_speed_zero: 1000
  homing_accel: 200000

# Mechanika domyślna; maszyna może ją nadpisać w instancji (overrides).
mechanics:
  kind: linear
  load: 40.0            # [kg] masa osi
  ratio: 7.9577e-04          # [m/rad]
  j_screw: 3.0000e-05       # [kg·m²]
  friction_coulomb: 0.06    # [N·m]
  friction_static: 0.08     # [N·m]
  friction_viscous: 4.0000e-04  # [N·m·s/rad]
  backlash: 2.0000e-05      # [m]
  contact_stiffness: 2000.0   # [N·m/rad] na wale
  gravity_force: 0.0

# Parametry krokowca (rdzeń C: 4 pełne kroki na okres elektryczny).
stepper:
  full_steps_per_rev: 200
  damping_ratio: 0.2      # względne tłumienie wirnika, ograniczone w rdzeniu do 20 % amplitudy

# Napęd rzeczywisty (REQ-VD-06, sesja 061): sterownik LinuxCNC; skala impulsów na mm/° wynika
# z motor.encoder_counts_per_rev i mechanics.ratio. Czasy impulsów przykładowe dla typowych
# sterowników krokowych. NIEZWERYFIKOWANE NA SPRZĘCIE.
real:
  driver: stepgen
  timing_ns: {steplen: 2500, stepspace: 2500, dirsetup: 10000, dirhold: 10000}
