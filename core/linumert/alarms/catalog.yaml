# Katalog alarmów linumeRT — jedyne źródło kodów i tekstów (PL/EN, teksty własne).
# Model-Author: Claude · sesja 007 · SPDX-License-Identifier: GPL-2.0-or-later
#
# Pola wpisu:
#   code    W-xxxx ostrzeżenie, E-xxxx błąd, K-3xx zdarzenie symulacji, P-5xxx błąd programu/ścieżki
#   clear   jak alarm znika: auto (źródło woła clear), ack (znika po potwierdzeniu),
#           reset (znika po resecie maszyny)
#   params  nazwy parametrów tekstu; muszą się zgadzać z {nazwami} w pl i en
# Znaczenia kodów poza tabelą w docs/wymagania/NARZEDZIA_I_KOLIZJE.md §3 to PROPOZYCJA
# (patrz docs/DZIENNIK.md, wpis 007); późniejsze sesje doprecyzowują je tutaj.

# ---- Ostrzeżenia ---------------------------------------------------------
- code: W-2104
  clear: ack
  params: [axis]
  pl: "Oś {axis} nie jest zbazowana."
  en: "Axis {axis} is not homed."
- code: W-2105
  clear: auto
  params: [axis, distance]
  pl: "Oś {axis} zbliża się do limitu programowego (zostało {distance} mm)."
  en: "Axis {axis} is approaching its soft limit ({distance} mm left)."
- code: W-2110
  clear: ack
  params: [tool]
  pl: "Narzędzie T{tool} przekroczyło zadaną trwałość."
  en: "Tool T{tool} has exceeded its configured life."
- code: W-2120
  clear: auto
  params: []
  pl: "Override posuwu wynosi 0 % przy uruchomionym programie."
  en: "Feed override is 0 % while a program is running."
- code: W-2130
  clear: ack
  params: [tool]
  pl: "Ręczna zmiana narzędzia T{tool} została przerwana; program zatrzymano."
  en: "Manual change of tool T{tool} was cancelled; the program was stopped."

# ---- Błędy LinuxCNC i maszyny --------------------------------------------
- code: E-1000
