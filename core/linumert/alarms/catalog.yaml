  en: "LinuxCNC message: {message}"
- code: E-1001
  clear: auto
  params: [detail]
  pl: "Brak łączności z LinuxCNC ({detail})."
  en: "No connection to LinuxCNC ({detail})."
- code: E-1100
  clear: reset
  params: []
  pl: "Stan awaryjny (E-stop) jest aktywny."
  en: "Emergency stop (E-stop) is active."
- code: E-1200
  clear: reset
  params: [axis]
  pl: "Oś {axis} wjechała na twardy ogranicznik (krańcówkę)."
  en: "Axis {axis} has hit its hard limit switch."

